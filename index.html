<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101011">
  <meta name="description" content="FutureApollo765’s personal showcase of interfaces and interactive projects built in Scratch.">
  <title>FutureApollo765 — Home</title>
  <link rel="icon" href="./assets/studio.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./orbit.css">
  <link rel="stylesheet" href="./projects.css">
  <link rel="stylesheet" href="./loader.css">
  <script type="module" src="./loader.js"></script>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./orbit.js"></script>
</head>
<body>
  <div id="studio-intro" hidden></div>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="FutureApollo765 home">
        <img src="./assets/studio.svg" alt="" width="26" height="26">
        <span>FutureApollo<span class="brand-number">765</span></span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#home" data-nav="home" aria-current="page">Home</a>
        <a href="#projects" data-nav="projects">Projects</a>
      </nav>
      <a class="profile-link" href="https://scratch.mit.edu/users/FutureApollo765/" target="_blank" rel="noopener">Scratch <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 18 18 6M7 6h11v11"/></svg></a>
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    <section id="home-view" class="view home-view" aria-labelledby="home-title">
      <div class="hero">
        <div class="hero-copy">
          <p class="eyebrow"><span class="signal" aria-hidden="true"></span>Personal showcase</p>
          <h1 id="home-title" aria-label="FutureApollo765">Future<br>Apollo<span class="hero-number">765</span></h1>
          <p class="intro-copy">I explore interface design and creative coding through interactive projects in Scratch.</p>
          <a class="explore" href="#projects">Explore projects <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12h17m-7-7 7 7-7 7"/></svg></a>
        </div>
        <figure class="instrument" aria-label="Interactive orbital assembly">
          <div class="instrument-field" aria-hidden="true">
            <i class="cross nw"></i><i class="cross ne"></i><i class="cross sw"></i><i class="cross se"></i>
            <i class="sight"></i>
          </div>
          <div class="orbit-object" tabindex="0" role="group" aria-label="Orbital assembly, drag or use left and right arrow keys to rotate" data-orbit>
            <img class="orbit-still" src="./assets/orbit/poster.webp" alt="" width="1080" height="1080" fetchpriority="high" draggable="false">
          </div>
          <figcaption class="orbit-caption">
            <span class="orbit-name">Orbital assembly</span>
            <span class="orbit-instruction"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12h18m-14-4-4 4 4 4m10-8 4 4-4 4"/></svg>Drag to rotate</span>
            <span class="angle" data-angle>000°</span>
          </figcaption>
        </figure>
      </div>
      <section class="featured" aria-labelledby="featured-title">
        <div class="featured-heading">
          <h2 id="featured-title">Selected work</h2>
          <a class="all-projects" href="#projects">View all projects <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></a>
        </div>
        <div class="selected-works" id="selected-works"></div>
      </section>
    </section>
    <section id="projects-view" class="view projects-view" aria-labelledby="projects-title" hidden></section>
    <noscript><p class="no-script">JavaScript enables the interactive gallery. <a href="https://scratch.mit.edu/users/FutureApollo765/">Browse FutureApollo765 on Scratch.</a></p></noscript>
  </main>
</body>
</html>
