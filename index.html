<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101011">
  <meta name="description" content="FutureApollo765’s personal showcase of interfaces and interactive projects built in Scratch.">
  <title>FutureApollo765 — Home</title>
  <link rel="icon" href="./assets/studio.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./orbit.css">
  <link rel="stylesheet" href="./project-index.css">
  <link rel="stylesheet" href="./index-lettering.css">
  <link rel="stylesheet" href="./studies.css">
  <link rel="stylesheet" href="./timeline.css">
  <link rel="stylesheet" href="./selected.css">
  <link rel="stylesheet" href="./projects.css">
  <link rel="stylesheet" href="./map-surface.css">
  <link rel="stylesheet" href="./loader.css">
  <link rel="stylesheet" href="./transition.css">
  <script type="module" src="./loader.js"></script>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./orbit.js"></script>
</head>
<body>
  <div id="studio-intro" hidden></div>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="FutureApollo765 home">
        <img src="./assets/studio.svg" alt="" width="26" height="26">
        <span>FutureApollo<span class="brand-number">765</span></span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#home" data-nav="home" aria-current="page">Home</a>
        <a href="#projects" data-nav="projects">Projects</a>
      </nav>
      <div class="header-actions">
        <button class="motion-toggle" type="button" aria-label="Pause motion" title="Pause motion">
          <svg class="icon pause-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 6v12m6-12v12" stroke-width="2.3"/></svg>
          <svg class="icon resume-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m8 5 10 7-10 7z"/></svg>
        </button>
      <a class="profile-link" href="https://scratch.mit.edu/users/FutureApollo765/" target="_blank" rel="noopener">Scratch <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 18 18 6M7 6h11v11"/></svg></a>
      </div>
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    <section id="home-view" class="view home-view" aria-labelledby="home-title">
      <div class="home-sequence">
        <div class="home-stage">
          <div class="hero">
        <div class="hero-copy">
          <p class="eyebrow"><span class="signal" aria-hidden="true"></span>Personal showcase</p>
          <h1 id="home-title" aria-label="FutureApollo765"><span class="word-line"><span>Future</span></span><span class="word-line"><span>Apollo<span class="hero-number">765</span></span></span></h1>
          <p class="intro-copy">I explore interface design and creative coding through interactive projects in Scratch.</p>
          <a class="explore" href="#projects">Explore projects <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12h17m-7-7 7 7-7 7"/></svg></a>
        </div>
        <figure class="instrument" aria-label="Interactive orbital assembly">
          <div class="instrument-field" aria-hidden="true">
            <i class="cross nw"></i><i class="cross ne"></i><i class="cross sw"></i><i class="cross se"></i>
            <i class="sight"></i>
          </div>
          <div class="orbit-object" tabindex="0" role="group" aria-label="Orbital assembly, drag or use left and right arrow keys to rotate" data-orbit>
            <img class="orbit-still" src="./assets/orbit/poster.webp" alt="" width="1080" height="1080" fetchpriority="high" draggable="false">
          </div>
          <figcaption class="orbit-caption">
            <span class="orbit-name">Orbital assembly</span>
            <span class="orbit-instruction"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12h18m-14-4-4 4 4 4m10-8 4 4-4 4"/></svg><span class="drag-hint">Drag to rotate</span><span class="key-hint">Use ← → to rotate</span></span>
            <span class="angle" data-angle>000°</span>
          </figcaption>
        </figure>
        <section class="index-panel" aria-label="Project preview" inert>
          <div class="index-copy">
            <p class="index-kicker"><i aria-hidden="true"></i> Project index <span data-index-count></span></p>
            <h2 class="index-title" data-index-title></h2>
            <a class="index-open" data-index-link>Open project <span aria-hidden="true">↗</span></a>
          </div>
          <a class="index-plate" data-index-cover tabindex="-1" aria-hidden="true">
            <div class="index-image-window"></div>
            <span class="index-plate-label" aria-hidden="true"><span>Scratch</span><i></i><span class="index-swipe-hint"><span class="pointer-word">Drag</span><span class="touch-word">Swipe</span> to browse ↔</span><span data-plate-number></span></span>
          </a>
        </section>
          </div>
          <div class="scene-controls">
            <button type="button" class="scroll-cue">
              <span class="scroll-wheel" aria-hidden="true"></span>Project studies
            </button>
            <span class="index-legend" aria-hidden="true">Project index <span class="scene-meter"><i></i></span></span>
          </div>
          <div class="project-deck" hidden>
            <div class="deck-choices" role="group" aria-label="Home project index" aria-description="Use the arrow keys to preview a project. Enter opens it."></div>
            <a class="deck-map" href="#projects" aria-label="Explore the full project map">Map <span aria-hidden="true">↗</span></a>
          </div>
        </div>
      </div>
      <section id="project-studies" aria-labelledby="studies-title" tabindex="-1"></section>
      <section id="project-timeline" aria-label="Project timeline"></section>
      <section class="featured" id="selected-work" aria-labelledby="featured-title" tabindex="-1">
        <div data-selected-work></div>
      </section>
    </section>
    <section id="projects-view" class="view projects-view" aria-labelledby="projects-title" hidden></section>
    <noscript><p class="no-script">JavaScript enables the interactive gallery. <a href="https://scratch.mit.edu/users/FutureApollo765/">Browse FutureApollo765 on Scratch.</a></p></noscript>
  </main>
</body>
</html>
